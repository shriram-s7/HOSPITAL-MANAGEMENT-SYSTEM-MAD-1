openapi: 3.0.0
info:
  title: Hospital Management API
  version: 1.0.0
paths:
  /patient/api/doctors:
    get:
      summary: Get list of doctors
      responses:
        '200':
          description: A list of doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    specialization:
                      type: string