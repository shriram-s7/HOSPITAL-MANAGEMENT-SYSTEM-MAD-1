{% extends "base.html" %}
{% block content %}
<h3>Edit Patient</h3>
<form method="post">
  <div class="mb-2"><label>Full name</label><input name="fullname" class="form-control" value="{{ patient[1] }}"></div>
  <div class="mb-2"><label>Contact</label><input name="contact" class="form-control" value="{{ patient[2] }}"></div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
